# ==============================================================================
# Golf Swing Compare - Nginx 內網部署範例設定檔
# ==============================================================================
# 使用說明：
# 1. 將 `npm run build` 後產生的 `out/` 資料夾內容複製到伺服器的網頁根目錄 (如 /usr/share/nginx/html/golf)
# 2. 將 SSL 憑證 (crt/pem) 與私鑰 (key) 放至伺服器對應路徑
# 3. 根據您的內網 IP 或域名修改 server_name 與 ssl_certificate 路徑
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name golf.internal.local; # 請修改為您的內網 IP (如 192.168.1.100) 或內網域名
    server_tokens off;

    # 強制將 HTTP 重新導向至 HTTPS (Camera API 與 PWA 需要 HTTPS)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name golf.internal.local; # 請修改為您的內網 IP 或內網域名
    server_tokens off;

    # SSL 憑證設定 (請替換為您的內網憑證路徑)
    ssl_certificate     /etc/nginx/ssl/golf.internal.crt;
    ssl_certificate_key /etc/nginx/ssl/golf.internal.key;

    # SSL 最佳化設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 網頁根目錄 (放置 next build 匯出的 out/ 資料夾內容)
    root /usr/share/nginx/html;
    index index.html;

    # MIME types 設定 (確保 WebM / MP4 影片正常串流與播放)
    include /etc/nginx/mime.types;
    types {
        video/webm webm;
        video/mp4 mp4;
    }

    # Gzip 壓縮設定 (加速內網載入)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Next.js App Router 路由支援 (嘗試比對 .html 檔，若無則降級回 index.html)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # PWA Service Worker 與 Manifest 避免快取 (確保 PWA 升級時能即時更新)
    location ~* (sw\.js|manifest\.json|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        # location 內只要有 add_header，就不會繼承 server 層的標頭，因此需重複列出
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # 靜態資源長快取 (Next.js 打包後的 JS/CSS 帶 Hash)
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # 基本安全標頭設定
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Next.js 靜態匯出會產生 inline script，因此 script-src 需要 'unsafe-inline'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
}
